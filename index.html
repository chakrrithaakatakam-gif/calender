<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calendar-container">
    <header class="calendar-header">
      <h2 id="month-year"></h2>
      <div class="nav-buttons">
        <button type="button" id="prev-btn" aria-label="Previous Month">&#10094;</button>
        <button type="button" id="today-btn">Today</button>
        <button type="button" id="next-btn" aria-label="Next Month">&#10095;</button>
      </div>
    </header>

    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="days" id="days-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
